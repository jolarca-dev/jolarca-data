# security.yml — gitleaks secret scanning in CI.
# Pre-commit runs gitleaks locally, but CI catches bypasses (--no-verify).
# SOC 2 CC6.6: warehouse credentials must never reach git history.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"   # nightly full-history scan
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          GL_VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --no-banner --redact
