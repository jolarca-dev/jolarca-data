# dbt-ci.yml — warehouse gate: sqlfluff -> dbt parse -> dbt build (slim
# CI against an ephemeral warehouse seeded with synthetic fixtures) ->
# dbt test. Never connects to staging/production.
name: dbt-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbt_ci
          POSTGRES_PASSWORD: dbt_ci
          POSTGRES_DB: analytics_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbt_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      WH_HOST: 127.0.0.1
      WH_PORT: "5432"
      WH_DB: analytics_ci
      WH_SCHEMA: dbt_ci
      WH_USER: dbt_ci
      WH_PASSWORD: dbt_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dbt + sqlfluff
        run: pip install --quiet "dbt-core>=1.8" "dbt-postgres>=1.8" "sqlfluff>=3.2" "sqlfluff-templater-dbt>=3.2"

      - name: Write CI dbt profile (ephemeral warehouse only)
        working-directory: warehouse
        run: |
          cat > profiles.yml <<'EOF'
          jol_m_data:
            target: dev
            outputs:
              dev:
                type: postgres
                host: "{{ env_var('WH_HOST') }}"
                port: "{{ env_var('WH_PORT') | int }}"
                user: "{{ env_var('WH_USER') }}"
                password: "{{ env_var('WH_PASSWORD') }}"
                dbname: "{{ env_var('WH_DB') }}"
                schema: "{{ env_var('WH_SCHEMA') }}"
          EOF

      - name: Load synthetic raw schema (fixtures, never production data)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgresql://dbt_ci:dbt_ci@127.0.0.1:5432/analytics_ci" -f .github/workflows/ci-raw-schema.sql

      - name: dbt deps
        working-directory: warehouse
        run: dbt deps --no-version-check

      - name: sqlfluff lint (dbt templater)
        run: sqlfluff lint warehouse/models --config .sqlfluff

      - name: dbt parse
        working-directory: warehouse
        run: dbt parse --no-version-check

      - name: dbt build (slim CI)
        working-directory: warehouse
        run: dbt build --no-version-check

      - name: dbt test
        working-directory: warehouse
        run: dbt test --no-version-check
