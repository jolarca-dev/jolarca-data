# ci.yml — inherited baseline gate: lint + validate everything committed.
# Job name MUST stay "ci": branch protection requires the "ci" status check.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a379cfe2253b2a72d6cd7c54c3a5cf16d0b9e529 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: pip install --quiet "yamllint>=1.35" "pyyaml>=6.0" "jsonschema>=4.23"

      - name: YAML lint
        run: |
          YAMLLINT_CFG="{extends: default, rules: {line-length: {max: 140},"
          YAMLLINT_CFG="$YAMLLINT_CFG comments: {min-spaces-from-content: 1},"
          YAMLLINT_CFG="$YAMLLINT_CFG truthy: disable, document-start: disable,"
          YAMLLINT_CFG="$YAMLLINT_CFG comments-indentation: disable}}"
          yamllint -d "$YAMLLINT_CFG" .github/ .pre-commit-config.yaml qodana.yaml

      - name: Seed & taxonomy schema validation
        run: python3 scripts/validate-seed.py

      - name: Catalog lint (no orphan datasets)
        run: python3 scripts/catalog-lint.py

      - name: PII pattern scan (committed files)
        run: bash scripts/check-personal-data.sh

      - name: Shellcheck operator scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
