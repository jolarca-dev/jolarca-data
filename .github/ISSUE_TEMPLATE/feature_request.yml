name: Feature request
description: New capability for the data platform or its automation
labels: ["enhancement"]
body:
  - type: textarea
    id: capability
    attributes:
      label: Capability
      description: What should the data platform/repository be able to do, and why now?
    validations:
      required: true
  - type: textarea
    id: driver
    attributes:
      label: Business / regulatory driver
      description: Which need drives this (VAT-OSS reporting, seller health, DSA transparency, retention duty, cost)?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - warehouse-models
        - ingestion
        - quality
        - seed-taxonomy
        - governance
        - lifecycle
        - ml
        - automation
        - other
    validations:
      required: true
